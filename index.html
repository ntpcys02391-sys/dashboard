<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青職基地 場租使用分析儀表板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #484f58;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #d29922;
    --accent4: #f78166;
    --accent5: #bc8cff;
    --card-r: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    padding: 0;
  }
  .header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border2);
    padding: 28px 32px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }
  .header-inner {
    max-width: 1300px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header-title {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo-badge {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #58a6ff22, #58a6ff44);
    border: 1px solid #58a6ff55;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  h1 { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
  .header-sub { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .year-tabs {
    display: flex;
    gap: 8px;
    background: var(--bg3);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .tab-btn {
    padding: 7px 20px;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--text2);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(88,166,255,0.3);
  }
  .tab-btn:hover:not(.active) { background: var(--bg2); color: var(--text); }
  .main { max-width: 1300px; margin: 0 auto; padding: 28px 32px; }
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
  }
  .kpi-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 18px 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .kpi-card:hover { border-color: var(--border2); }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
  }
  .kpi-card.blue::before { background: var(--accent); }
  .kpi-card.green::before { background: var(--accent2); }
  .kpi-card.amber::before { background: var(--accent3); }
  .kpi-card.purple::before { background: var(--accent5); }
  .kpi-card.coral::before { background: var(--accent4); }
  .kpi-label { font-size: 12px; color: var(--text2); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; }
  .kpi-val { font-size: 32px; font-weight: 700; font-family: 'DM Mono', monospace; color: var(--text); line-height: 1; }
  .kpi-unit { font-size: 14px; font-weight: 400; color: var(--text2); margin-left: 4px; }
  .kpi-trend { font-size: 12px; color: var(--text2); margin-top: 8px; }
  .kpi-trend.up { color: var(--accent2); }
  .kpi-trend.down { color: var(--accent4); }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-bottom: 20px;
  }
  .charts-grid.wide { grid-template-columns: 1fr; }
  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
    padding: 22px 24px;
  }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .chart-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.2px;
  }
  .chart-subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .legend-row {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 11px 4px 7px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s, background 0.15s, opacity 0.15s, color 0.15s;
  }
  .legend-chip:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
  .legend-chip.active { color: var(--text); }
  .legend-chip.muted  { opacity: 0.38; }
  .legend-chip-box {
    width: 13px; height: 13px;
    border-radius: 3px;
    border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .legend-chip.active .legend-chip-box {
    background: var(--chip-color, #58a6ff);
    border-color: var(--chip-color, #58a6ff);
  }
  .legend-chip.active .legend-chip-check { opacity: 1; }
  .legend-chip.muted  .legend-chip-box   { background: transparent; }
  .legend-chip.muted  .legend-chip-check { opacity: 0; }
  .legend-chip-check {
    width: 7px; height: 7px;
    opacity: 1;
    transition: opacity 0.12s;
  }
  .canvas-wrap {
    position: relative;
    width: 100%;
  }
  .filter-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 14px 18px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--card-r);
  }
  .filter-label { font-size: 13px; color: var(--text2); }
  .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.1); }
  .filter-chip:hover:not(.active) { border-color: var(--border2); color: var(--text); }
  .hm-table-wrap { overflow-x: visible; }
  .hm-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 2px;
    font-size: 11px;
    table-layout: fixed;
  }
  .hm-table th {
    color: var(--text2);
    font-weight: 500;
    font-size: 11px;
    padding: 4px 2px;
    text-align: center;
    white-space: nowrap;
  }
  .hm-table th.col-month { text-align: left; width: 44px; }
  .hm-table th.col-floor { width: 30px; }
  .hm-table th.col-total { color: var(--accent); width: 34px; }
  .hm-table td {
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }
  .hm-table td.td-month {
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
    padding: 1px 4px 1px 0;
    text-align: left;
    vertical-align: middle;
    white-space: nowrap;
    width: 44px;
  }
  .hm-table td.td-floor {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 2px;
    white-space: nowrap;
    width: 30px;
  }
  .hm-table td.td-floor.f1 { color: var(--accent); }
  .hm-table td.td-floor.f2 { color: var(--accent5); }
  .hm-table td.td-total {
    font-size: 12px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    padding: 1px 3px;
    width: 34px;
  }
  .hm-table td.td-total.f2 { color: var(--accent5); }
  .hm-cell-new {
    height: 26px;
    width: 100%;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    cursor: default;
    transition: filter 0.15s;
    margin: 1px 0;
  }
  .hm-cell-new:hover { filter: brightness(1.2); }
  .hm-cell-new.closed { background: rgba(255,255,255,0.04); color: var(--text3); font-size: 11px; border-radius: 5px; }
  .hm-legend {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text2);
    flex-wrap: wrap;
  }
  .hm-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .hm-legend-swatch {
    width: 28px;
    height: 16px;
    border-radius: 3px;
  }
  .hm-month-divider td { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 4px; }
  .period-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
  }
  .badge-a { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-b { background: rgba(63,185,80,0.15); color: var(--accent2); }
  .badge-c { background: rgba(210,153,34,0.15); color: var(--accent3); }
  .section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }
  .compare-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .data-table th {
    padding: 8px 12px;
    text-align: left;
    color: var(--text2);
    font-weight: 500;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .data-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: rgba(255,255,255,0.03); }
  .mono { font-family: 'DM Mono', monospace; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
  }
  .tag-1f { background: rgba(88,166,255,0.15); color: var(--accent); }
  .tag-2f { background: rgba
